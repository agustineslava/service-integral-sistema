<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Integral - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css?v=2.2">
    <script src="marca.js?v=2.2"></script>
</head>
<body class="pantalla-login">

    <main class="caja-login">
        <!--
            Arranque NEUTRAL a proposito.

            Antes esta pantalla ponia el logo y el nombre de Service Integral en
            todos los casos, porque `marca.js` pedia /api/config-comercio sin
            token y el servidor respondia con la marca de entorno. Con eso cada
            cliente veia en el login el nombre de la empresa numero 1: el
            sistema decia ser de varias empresas y en pantalla era de una sola.

            Ahora el logo arranca oculto y el nombre es neutro. La marca real la
            escribe `aplicarMarcaDesdeConfig` recien cuando el email escrito
            pertenece a una empresa. Quien no escribe nada ve una pantalla
            HONESTA: no se le muestra el nombre de ninguna empresa todavia.
        -->
        <img src="logos/logo.jpg" alt="" class="login-logo" hidden>

        <h1 class="login-titulo" data-neutral>Gestión de Taller y Stock</h1>
        <p class="login-subtitulo" data-neutral>Ingresá con tu correo de la empresa</p>

        <div id="mensaje-error" class="error-login"></div>
        <div id="mensaje-info" class="info-login"></div>

        <form id="form-login" class="login-form">
            <div class="campo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required autocomplete="email" placeholder="usuario@empresa.com">
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <div class="campo-password-wrapper">
                    <input type="password" id="password" required placeholder="••••••••">
                    <button type="button" class="btn-toggle-password" onclick="toggleVisibilidadPassword('password', this)" aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-crear w-100 btn-login">Ingresar al Sistema</button>
        </form>
    </main>

    <script>
        const emailInput    = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const form          = document.getElementById('form-login');
        const errorDiv      = document.getElementById('mensaje-error');
        const infoDiv       = document.getElementById('mensaje-info');
        const boton         = form.querySelector('button[type="submit"]');

        /* ------------------------------------------------------------------
           Avisos
           ------------------------------------------------------------------ */

        function mostrarError(msg) {
            errorDiv.textContent = msg;
            errorDiv.hidden = false;
            infoDiv.hidden = true;
        }

        function mostrarInfo(msg) {
            infoDiv.textContent = msg;
            infoDiv.hidden = false;
        }

        function limpiarAvisos() {
            errorDiv.hidden = true;
            errorDiv.textContent = '';
            infoDiv.hidden = true;
            infoDiv.textContent = '';
        }

        /* ------------------------------------------------------------------
           F5c: descubrir a que empresa pertenece el email escrito
           ------------------------------------------------------------------

           Al salir del campo (blur) se le pregunta al servidor. Si el email
           pertenece a una empresa activa, se muestra SU logo, SU nombre y SU
           color antes de que la persona escriba la clave: la pantalla ya le
           dice en que sistema esta entrando.

           Si NO pertenece a ninguna empresa, NO se dice nada. Dos razones:

             1. El SUPERADMIN no pertenece a ninguna empresa. Con la version
                anterior, escribir su correo y salir del campo le devolvia
                "Email no registrado en ninguna empresa activa", o sea, le
                deciamos a la persona que su cuenta no existia. Perder el
                acceso por un cartel fue exactamente lo que paso.

             2. Decir "no existe" esEnumerar correos. No hace falta: el login
                ya responde correctamente y sin filtrar nada cuando se
                mandan mal.

           Que no haya marca no es un error: se sigue escribiendo la clave.
        ------------------------------------------------------------------ */
        let consultaEnCurso = false;
        let ultimaConsultada = '';

        emailInput.addEventListener('blur', async () => {
            const email = emailInput.value.trim().toLowerCase();
            if (consultaEnCurso) return;
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return;
            if (email === ultimaConsultada) return;   // no repetir la misma

            consultaEnCurso = true;
            emailInput.classList.add('buscando');

            try {
                const res = await fetch(
                    `/api/central/empresa-por-email?email=${encodeURIComponent(email)}`,
                    { headers: { Accept: 'application/json' } }
                );
                const datos = await res.json();

                if (datos.encontrado && datos.slug) {
                    const r2 = await fetch(`/api/config-comercio?slug=${encodeURIComponent(datos.slug)}`);
                    const conf = await r2.json();
                    if (aplicarMarcaDesdeConfig(conf)) {
                        mostrarInfo(`Entrando a ${conf.nombre}`);
                    }
                    ultimaConsultada = email;
                }
                // No encontrado: se queda neutral y en silencio. Ver nota arriba.
            } catch (err) {
                // Falla de red: no se muestra nada. El login va a fallar solo y
                // con un mensaje util si realmente no hay conexion.
                console.warn('No se pudo consultar la empresa:', err);
            } finally {
                consultaEnCurso = false;
                emailInput.classList.remove('buscando');
            }
        });

        // Si la persona corrige el email a mano, se limpia el aviso anterior.
        emailInput.addEventListener('input', limpiarAvisos);

        /* ------------------------------------------------------------------
           Login
           ------------------------------------------------------------------ */
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            limpiarAvisos();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            boton.disabled = true;
            boton.textContent = 'Ingresando...';

            try {
                const respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await respuesta.json();

                if (!respuesta.ok) {
                    mostrarError(data.error || 'No se pudo iniciar sesion');
                    passwordInput.value = '';
                    passwordInput.focus();
                    return;
                }

                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('usuario_actual', JSON.stringify(data.usuario));

                // El SUPERADMIN no pertenece a ninguna empresa: es el que
                // administra el servicio entero. Si lo mandáramos a index.html,
                // esa página pediría /api/mi-empresa, que le contesta 403, y
                // auth-check lo devolvería al login. Un loop sin fin.
                if (data.usuario && data.usuario.rol === 'SUPERADMIN') {
                    localStorage.removeItem('empresa_actual');
                    window.location.href = 'admin.html';
                    return;
                }

                // La empresa (marca, plan, limite y módulos contratados) se
                // guarda acá para no ir a buscarla en cada página. Se puede
                // refrescar con GET /api/mi-empresa.
                if (data.empresa) {
                    localStorage.setItem('empresa_actual', JSON.stringify(data.empresa));
                }
                window.location.href = 'index.html';

            } catch (err) {
                mostrarError('No se pudo conectar con el servidor');
            } finally {
                boton.disabled = false;
                boton.textContent = 'Ingresar al Sistema';
            }
        });

        function toggleVisibilidadPassword(idInput, boton) {
            const input = document.getElementById(idInput);
            const svg = boton.querySelector('svg');

            if (input.type === 'password') {
                input.type = 'text';
                boton.setAttribute('aria-label', 'Ocultar contraseña');
                svg.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                input.type = 'password';
                boton.setAttribute('aria-label', 'Mostrar contraseña');
                svg.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }
    </script>
</body>
</html>
