<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Integral - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css?v=1.3">
    <script src="marca.js"></script>
</head>
<body class="pantalla-login">

    <main class="caja-login">
        <img src="logos/logo.jpg" alt="Logo Service Integral" class="login-logo">
        <h1 class="login-titulo">Service Integral</h1>
        <p class="login-subtitulo">Gestión de Stock y Taller</p>

        <div id="mensaje-error" class="error-login"></div>

        <form id="form-login" class="login-form">
    <div class="campo">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" required autocomplete="email" placeholder="usuario@serviceintegral.com">
    </div>
    
    <div class="campo">
        <label for="password">Contraseña:</label>
        <div class="campo-password-wrapper">
            <input type="password" id="password" required placeholder="••••••••">
            <button type="button" class="btn-toggle-password" onclick="toggleVisibilidadPassword('password', this)" aria-label="Mostrar contraseña">
                <!-- SVG de Ojo Cerrado / Abierto -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
    </div>

    <button type="submit" class="btn btn-crear w-100 btn-login">Ingresar al Sistema</button>
</form>
    </main>

    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('mensaje-error');

            errorDiv.style.display = 'none';

            try {
                const respuesta = await fetch(`${window.location.origin}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    localStorage.setItem('jwt_token', data.token);
                    localStorage.setItem('usuario_actual', JSON.stringify(data.usuario));

                    // El SUPERADMIN no pertenece a ninguna empresa: es el que
                    // administra el servicio entero. Si lo mandáramos a
                    // index.html, esa página pediría /api/mi-empresa, que le
                    // contesta 403 (no es una empresa), y auth-check lo
                    // devolvería al login. Un loop sin fin.
                    if (data.usuario && data.usuario.rol === 'SUPERADMIN') {
                        // Sin empresa no hay marca que aplicar: se saca la que
                        // quedó de un login anterior, si hubo.
                        localStorage.removeItem('empresa_actual');
                        window.location.href = 'admin.html';
                        return;
                    }

                    // La empresa (marca, plan, límite y módulos contratados)
                    // se guarda acá para no tener que ir a buscarla en cada
                    // página. Se puede refrescar con GET /api/mi-empresa.
                    if (data.empresa) {
                        localStorage.setItem('empresa_actual', JSON.stringify(data.empresa));
                    }
                    window.location.href = 'index.html';
                } else {
                    errorDiv.textContent = data.error || 'Usuario o contraseña incorrectos';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'No se pudo conectar con el servidor';
                errorDiv.style.display = 'block';
            }
        });

        function toggleVisibilidadPassword(idInput, boton) {
        const input = document.getElementById(idInput);
        const svg = boton.querySelector('svg');

        if (input.type === 'password') {
            input.type = 'text';
            // SVG Ojo Tachado / Activo
            svg.innerHTML = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
        } else {
            input.type = 'password';
            // SVG Ojo Normal
            svg.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
        }
    }
    </script>

    
</body>
</html>
